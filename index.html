<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P 跨裝置檔案傳輸</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; line-height: 1.6; }
        .box { border: 1px solid #ccc; padding: 15px; margin-top: 15px; border-radius: 8px; }
        button { padding: 8px 15px; margin-right: 5px; margin-bottom: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; }
        button:hover { background: #0056b3; }
        .btn-gallery { background: #e83e8c; } 
        .btn-gallery:hover { background: #c23375; }
        .btn-send { background: #ff9800; display: none; width: 100%; margin-top: 10px; font-size: 16px; }
        .btn-send:hover { background: #e68a00; }
        .btn-download-all { background: #17a2b8; display: none; width: 100%; margin-bottom: 15px; }
        #qrcode { margin-top: 15px; background: white; padding: 10px; display: inline-block; border-radius: 8px; }
        #fileListPreview { margin-top: 10px; font-size: 14px; color: #555; max-height: 100px; overflow-y: auto; }
        
        /* 檔案接收區塊：改為網格(Grid)排版，並排顯示小卡片 */
        #messages { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); 
            gap: 10px; 
        }
        /* 獨立檔案卡片設計 */
        .file-item { 
            padding: 10px; background: #f8f9fa; border-radius: 8px; 
            border-top: 4px solid #28a745; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }
        /* 檔名過長自動截斷變 ... */
        .file-name { 
            font-size: 12px; width: 100%; white-space: nowrap; overflow: hidden; 
            text-overflow: ellipsis; text-align: center; margin-bottom: 8px; font-weight: bold;
        }
        /* 縮圖統一尺寸並置中裁切 */
        img.preview { 
            width: 70px; height: 70px; object-fit: cover; border-radius: 5px; margin-bottom: 8px; 
        }
        .file-icon { font-size: 40px; margin-bottom: 8px; }
        /* 縮小下載按鈕 */
        .btn-dl-single { 
            padding: 4px 8px; background: #28a745; color: white; text-decoration: none; 
            border-radius: 4px; font-size: 12px; width: 100%; text-align: center; box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h2>即時檔案傳輸通道</h2>
    
    <div class="box">
        <p id="status" style="font-weight: bold; color: #d9534f;">正在初始化網路連線...</p>
    </div>

    <div class="box" id="hostBox" style="display: none;">
        <label>📱 <b>請用另一台裝置掃描此 QR Code 連線：</b></label>
        <div id="qrcode"></div>
    </div>

    <div class="box" id="transferBox" style="display: none;">
        <label>1. 選擇要傳送的檔案 (可多選)：</label><br><br>
        
        <!-- 將 accept 嚴格限制為 image/* 提升喚醒原生相簿的機率 -->
        <input type="file" id="photoInput" multiple accept="image/*" style="display: none;" onchange="updateFileList(this)">
        <input type="file" id="fileInput" multiple style="display: none;" onchange="updateFileList(this)">

        <button class="btn-gallery" onclick="document.getElementById('photoInput').click()">🖼️ 從相簿選擇 (照片)</button>
        <button onclick="document.getElementById('fileInput').click()">📁 從檔案總管選擇</button>
        
        <div id="fileListPreview"></div>
        <button id="sendBtn" class="btn-send" onclick="sendSelectedFiles()">🚀 開始傳送</button>
    </div>

    <div class="box">
        <label>📥 接收到的檔案：</label><br><br>
        <button id="downloadAllBtn" class="btn-download-all" onclick="downloadAllFiles()">📦 一鍵下載全部</button>
        <div id="messages"></div>
    </div>

    <script>
        const peer = new Peer();
        let connection = null;
        let selectedFiles = []; 
        let receivedFilesList = []; 

        const urlParams = new URLSearchParams(window.location.search);
        const targetPeerId = urlParams.get('peerId');

        peer.on('open', (id) => {
            if (targetPeerId) {
                updateStatus('正在連接至目標裝置...', '#f0ad4e');
                connection = peer.connect(targetPeerId);
                setupConnection(connection);
            } else {
                updateStatus('等待掃描連線中...', '#0275d8');
                document.getElementById('hostBox').style.display = 'block';
                const connectUrl = window.location.href.split('?')[0] + '?peerId=' + id;
                new QRCode(document.getElementById("qrcode"), { text: connectUrl, width: 200, height: 200 });
            }
        });

        peer.on('connection', (conn) => {
            connection = conn;
            setupConnection(connection);
            document.getElementById('hostBox').style.display = 'none';
        });

        function setupConnection(conn) {
            conn.on('open', () => {
                updateStatus('✅ 連線成功！可以互相傳送檔案了。', '#5cb85c');
                document.getElementById('transferBox').style.display = 'block';
            });

            conn.on('data', (data) => {
                if (data.file && data.filename) {
                    const blob = new Blob([data.file], { type: data.filetype });
                    const url = URL.createObjectURL(blob);
                    
                    receivedFilesList.push({ url: url, filename: data.filename });
                    document.getElementById('downloadAllBtn').style.display = 'block';
                    
                    displayReceivedFile(url, data.filename, data.filetype);
                }
            });

            conn.on('close', () => {
                updateStatus('❌ 連線已中斷，請重新整理網頁。', '#d9534f');
                document.getElementById('transferBox').style.display = 'none';
            });
        }

        function updateFileList(inputElement) {
            selectedFiles = Array.from(inputElement.files);
            const preview = document.getElementById('fileListPreview');
            const sendBtn = document.getElementById('sendBtn');
            
            if (selectedFiles.length > 0) {
                preview.innerHTML = `已選擇 <b>${selectedFiles.length}</b> 個檔案：<br>` + 
                                    selectedFiles.map(f => `- ${f.name}`).join('<br>');
                sendBtn.style.display = 'block';
                sendBtn.innerText = `🚀 傳送這 ${selectedFiles.length} 個檔案`;
            } else {
                preview.innerHTML = '';
                sendBtn.style.display = 'none';
            }
        }

        async function sendSelectedFiles() {
            if (!connection || !connection.open) return alert('尚未建立連線！');
            if (selectedFiles.length === 0) return alert('請先選擇檔案');

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                updateStatus(`傳送中... (${i + 1}/${selectedFiles.length}) : ${file.name}`, '#f0ad4e');
                
                await new Promise(resolve => {
                    connection.send({ file: file, filename: file.name, filetype: file.type });
                    setTimeout(resolve, 300); 
                });
            }

            updateStatus('✅ 所有檔案已成功傳送！', '#5cb85c');
            sendBtn.disabled = false;
            
            document.getElementById('photoInput').value = '';
            document.getElementById('fileInput').value = '';
            selectedFiles = [];
            document.getElementById('fileListPreview').innerHTML = '';
            sendBtn.style.display = 'none';
        }

        // 新版檔案卡片 UI 生成邏輯
        function displayReceivedFile(url, filename, filetype) {
            const msgDiv = document.getElementById('messages');
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';

            const downloadBtn = `<a href="${url}" download="${filename}" class="btn-dl-single">📥 下載</a>`;
            const nameLabel = `<div class="file-name" title="${filename}">${filename}</div>`;

            if (filetype && filetype.startsWith('image/')) {
                fileItem.innerHTML = `${nameLabel}<img class="preview" src="${url}">${downloadBtn}`;
            } else {
                fileItem.innerHTML = `${nameLabel}<div class="file-icon">📄</div>${downloadBtn}`;
            }
            
            msgDiv.insertBefore(fileItem, msgDiv.firstChild);
        }

        async function downloadAllFiles() {
            if (receivedFilesList.length === 0) return;
            
            for (let i = 0; i < receivedFilesList.length; i++) {
                const file = receivedFilesList[i];
                const a = document.createElement('a');
                a.href = file.url;
                a.download = file.filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                await new Promise(resolve => setTimeout(resolve, 300));
            }
            alert('📥 已觸發全部下載！\n(視瀏覽器設定，可能需要手動允許「下載多個檔案」的權限)');
        }

        function updateStatus(msg, color) {
            const el = document.getElementById('status');
            el.innerText = msg;
            el.style.color = color;
        }
    </script>
</body>
</html>
