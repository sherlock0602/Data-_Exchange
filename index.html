<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P 跨裝置檔案傳輸</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; line-height: 1.6; }
        .box { border: 1px solid #ccc; padding: 15px; margin-top: 15px; border-radius: 8px; }
        button { padding: 8px 15px; margin-right: 5px; margin-bottom: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; }
        button:hover { background: #0056b3; }
        .btn-gallery { background: #e83e8c; } /* 相簿按鈕顏色 */
        .btn-gallery:hover { background: #c23375; }
        .btn-send { background: #ff9800; display: none; width: 100%; margin-top: 10px; font-size: 16px; }
        .btn-send:hover { background: #e68a00; }
        .btn-download-all { background: #17a2b8; display: none; width: 100%; margin-bottom: 15px; }
        #qrcode { margin-top: 15px; background: white; padding: 10px; display: inline-block; border-radius: 8px; }
        .file-item { margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 5px; word-break: break-all; border-left: 4px solid #28a745; }
        img.preview { max-width: 100%; border-radius: 8px; margin-top: 10px; }
        #fileListPreview { margin-top: 10px; font-size: 14px; color: #555; max-height: 100px; overflow-y: auto; }
    </style>
</head>
<body>
    <h2>即時檔案傳輸通道</h2>
    
    <div class="box">
        <p id="status" style="font-weight: bold; color: #d9534f;">正在初始化網路連線...</p>
    </div>

    <!-- QR Code 顯示區塊 -->
    <div class="box" id="hostBox" style="display: none;">
        <label>📱 <b>請用另一台裝置掃描此 QR Code 連線：</b></label>
        <div id="qrcode"></div>
    </div>

    <!-- 傳輸控制區塊 -->
    <div class="box" id="transferBox" style="display: none;">
        <label>1. 選擇要傳送的檔案 (可多選)：</label><br><br>
        
        <!-- 兩個隱藏的 input，分別處理相簿與檔案總管 -->
        <!-- multiple 允許一次選擇多個檔案 -->
        <!-- accept="image/*,video/*" 會強制手機優先開啟相簿 -->
        <input type="file" id="photoInput" multiple accept="image/*,video/*" style="display: none;" onchange="updateFileList(this)">
        <input type="file" id="fileInput" multiple style="display: none;" onchange="updateFileList(this)">

        <button class="btn-gallery" onclick="document.getElementById('photoInput').click()">🖼️ 從相簿選擇</button>
        <button onclick="document.getElementById('fileInput').click()">📁 從檔案夾選擇</button>
        
        <div id="fileListPreview"></div>
        <button id="sendBtn" class="btn-send" onclick="sendSelectedFiles()">🚀 開始傳送</button>
    </div>

    <div class="box">
        <label>📥 接收到的檔案：</label><br><br>
        <!-- 一鍵下載全部按鈕 -->
        <button id="downloadAllBtn" class="btn-download-all" onclick="downloadAllFiles()">📦 一鍵下載全部</button>
        <div id="messages"></div>
    </div>

    <script>
        const peer = new Peer();
        let connection = null;
        let selectedFiles = []; // 準備發送的檔案清單
        let receivedFilesList = []; // 已接收的檔案清單 (供一鍵下載使用)

        const urlParams = new URLSearchParams(window.location.search);
        const targetPeerId = urlParams.get('peerId');

        peer.on('open', (id) => {
            if (targetPeerId) {
                updateStatus('正在連接至目標裝置...', '#f0ad4e');
                connection = peer.connect(targetPeerId);
                setupConnection(connection);
            } else {
                updateStatus('等待掃描連線中...', '#0275d8');
                document.getElementById('hostBox').style.display = 'block';
                const connectUrl = window.location.href.split('?')[0] + '?peerId=' + id;
                new QRCode(document.getElementById("qrcode"), { text: connectUrl, width: 200, height: 200 });
            }
        });

        peer.on('connection', (conn) => {
            connection = conn;
            setupConnection(connection);
            document.getElementById('hostBox').style.display = 'none';
        });

        function setupConnection(conn) {
            conn.on('open', () => {
                updateStatus('✅ 連線成功！可以互相傳送檔案了。', '#5cb85c');
                document.getElementById('transferBox').style.display = 'block';
            });

            conn.on('data', (data) => {
                if (data.file && data.filename) {
                    const blob = new Blob([data.file], { type: data.filetype });
                    const url = URL.createObjectURL(blob);
                    
                    // 將收到的檔案加入清單
                    receivedFilesList.push({ url: url, filename: data.filename });
                    document.getElementById('downloadAllBtn').style.display = 'block';
                    
                    displayReceivedFile(url, data.filename, data.filetype);
                }
            });

            conn.on('close', () => {
                updateStatus('❌ 連線已中斷，請重新整理網頁。', '#d9534f');
                document.getElementById('transferBox').style.display = 'none';
            });
        }

        // 更新畫面上的已選檔案預覽
        function updateFileList(inputElement) {
            selectedFiles = Array.from(inputElement.files);
            const preview = document.getElementById('fileListPreview');
            const sendBtn = document.getElementById('sendBtn');
            
            if (selectedFiles.length > 0) {
                preview.innerHTML = `已選擇 <b>${selectedFiles.length}</b> 個檔案：<br>` + 
                                    selectedFiles.map(f => `- ${f.name}`).join('<br>');
                sendBtn.style.display = 'block';
                sendBtn.innerText = `🚀 傳送這 ${selectedFiles.length} 個檔案`;
            } else {
                preview.innerHTML = '';
                sendBtn.style.display = 'none';
            }
        }

        // 依序傳送檔案 (避免一次塞入太多導致 WebRTC 當機)
        async function sendSelectedFiles() {
            if (!connection || !connection.open) return alert('尚未建立連線！');
            if (selectedFiles.length === 0) return alert('請先選擇檔案');

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                updateStatus(`傳送中... (${i + 1}/${selectedFiles.length}) : ${file.name}`, '#f0ad4e');
                
                // 等待 Promise 完成，確保檔案依序傳送
                await new Promise(resolve => {
                    connection.send({
                        file: file,
                        filename: file.name,
                        filetype: file.type
                    });
                    // 加入 500 毫秒延遲，讓網路緩衝區有時間消化
                    setTimeout(resolve, 500); 
                });
            }

            updateStatus('✅ 所有檔案已成功傳送！', '#5cb85c');
            sendBtn.disabled = false;
            
            // 傳送完畢後清空選擇
            document.getElementById('photoInput').value = '';
            document.getElementById('fileInput').value = '';
            selectedFiles = [];
            document.getElementById('fileListPreview').innerHTML = '';
            sendBtn.style.display = 'none';
        }

        // 顯示接收到的檔案
        function displayReceivedFile(url, filename, filetype) {
            const msgDiv = document.getElementById('messages');
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';

            const downloadBtn = `<a href="${url}" download="${filename}" style="display: inline-block; margin-top: 10px; padding: 6px 12px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; font-size: 13px;">📥 單獨下載</a>`;

            if (filetype && filetype.startsWith('image/')) {
                fileItem.innerHTML = `<strong>${filename}</strong><br><img class="preview" src="${url}"><br>${downloadBtn}`;
            } else {
                fileItem.innerHTML = `<strong>${filename}</strong><br>${downloadBtn}`;
            }
            
            msgDiv.insertBefore(fileItem, msgDiv.firstChild);
        }

        // 一鍵下載全部收到的檔案
        async function downloadAllFiles() {
            if (receivedFilesList.length === 0) return;
            
            // 由於瀏覽器安全機制，連續彈出多個下載可能會被當作廣告彈窗阻擋
            // 因此這裡加入短暫的間隔時間依序觸發下載
            for (let i = 0; i < receivedFilesList.length; i++) {
                const file = receivedFilesList[i];
                const a = document.createElement('a');
                a.href = file.url;
                a.download = file.filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                await new Promise(resolve => setTimeout(resolve, 300));
            }
            alert('📥 已觸發全部下載！\n(如果瀏覽器提示「是否允許下載多個檔案」，請點選允許)');
        }

        function updateStatus(msg, color) {
            const el = document.getElementById('status');
            el.innerText = msg;
            el.style.color = color;
        }
    </script>
</body>
</html>
